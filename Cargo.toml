[package]
name = "skyatlaz-service"
version = "0.1.0"
edition = "2021"
description = "Serves the SkyBlock profile of the authenticated player, holding one Hypixel key"
license = "MIT"
repository = "https://github.com/bgrados31/skyatlaz-service"
homepage = "https://github.com/bgrados31/skyatlaz-service#readme"
readme = "README.md"
keywords = ["hypixel", "minecraft", "skyblock", "hypixel-api", "self-hosted"]
categories = ["web-programming::http-server"]
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dotenvy = "0.15"
hmac = "0.12"
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
digest = { version = "0.10", features = ["oid"] }
uuid = { version = "1", features = ["v4"] }
rand_core = { version = "0.6", features = ["getrandom"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["set-header", "timeout", "trace"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
# The service runs on a free ARM VM: a small binary means a fast deploy, while
# a single codegen unit and fat LTO give the best runtime of that size budget.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Aborting keeps the binary small. It also means no code may rely on
# catch_unwind, see AGENTS.md.
panic = "abort"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
# The code reads like prose on purpose (see AGENTS.md); these lints punish that.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
