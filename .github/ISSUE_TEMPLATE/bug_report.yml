name: Bug report
description: Something the service does, or refuses to do, that is not what the contract says.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Two things before you write:

        - **Never paste a key, a session token, a nonce or a signature.** Not in a
          log, not in a screenshot. If you already did, rotate the Hypixel key at
          developer.hypixel.net.
        - **A security problem does not belong here.** Use the Security tab →
          Report a vulnerability, as described in SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The request you sent, the answer you got, and what the contract said you should get.
      placeholder: |
        curl -sS -D- http://127.0.0.1:8080/v1/profile -H 'Authorization: Bearer <token>'
        → 502 upstream_error, the contract says only 200 or 401 are possible here
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce it
      description: The smallest sequence that shows it, from a fresh start.
      placeholder: |
        1. cargo run --release with PROFILE_TTL_SECONDS=1
        2. call /v1/profile twice in the same second
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `curl -sS http://127.0.0.1:8080/health`, or the commit you built.
      placeholder: '{"ok":true,"service":"skyatlaz-service","version":"0.1.0",...}'
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Where it runs
      description: Operating system, how you run it (cargo, container, systemd) and whether a proxy is in front.
      placeholder: Windows 11, cargo run --release, no proxy
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Configuration
      description: Which environment variables are set, without their values, and anything relevant from the log at RUST_LOG=debug.
      placeholder: |
        BIND is unset, PORT=8080, PROFILE_CACHE_ENTRIES=1024
        RUST_LOG=debug shows: upstream answered 500
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read the failure modes in docs/ARCHITECTURE.md and this is not one of them.
          required: true
        - label: There is no key, token, nonce or signature in this report.
          required: true
