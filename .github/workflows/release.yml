name: release

# A deploy on a small VM should be a download, not a five minute compile.
# Both targets are static musl builds so the same tarball runs on any Linux.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  release:
    name: build and publish the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2

      # The toolchain version lives in rust-toolchain.toml, so read it instead of
      # repeating it here: a release built with a different compiler than CI has
      # no business shipping.
      - name: read the pinned toolchain
        id: pin
        run: echo "channel=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - name: install the pinned toolchain and both targets
        env:
          CHANNEL: ${{ steps.pin.outputs.channel }}
        run: |
          set -eu
          rustup toolchain install "$CHANNEL" --profile minimal
          rustup target add --toolchain "$CHANNEL" \
            x86_64-unknown-linux-musl aarch64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      # `cross` builds inside a container image that carries the musl cross
      # toolchain for the foreign architecture. Ubuntu's aarch64-linux-gnu gcc is
      # a glibc compiler: `ring` compiles its C against the host headers and the
      # link fails on a musl target, which is how the first release run died.
      # The host architecture does not need it.
      - name: install cross
        uses: taiki-e/install-action@cross

      - name: build x86_64-unknown-linux-musl
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: build aarch64-unknown-linux-musl
        run: cross build --release --locked --target aarch64-unknown-linux-musl

      # "Static" is the promise of these artifacts: nothing to install on the
      # server. A glibc-linked binary would still run here and fail on a musl
      # distribution, so check before publishing instead of after deploying.
      - name: prove the binaries are static
        run: |
          set -eu
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            file "target/${target}/release/skyatlaz-service" | tee /dev/stderr | grep -q "statically linked"
          done

      - name: package
        run: |
          set -eu
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            tar -czf "skyatlaz-service-${target}.tar.gz" \
              -C "target/${target}/release" skyatlaz-service
          done
          sha256sum skyatlaz-service-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: publish
        uses: softprops/action-gh-release@v3
        with:
          # `body` and `generate_release_notes` are mutually exclusive: this body
          # is the one that knows how to check a checksum and where the deploy
          # notes are. The commit list is one click away in the changelog.
          fail_on_unmatched_files: true
          files: |
            skyatlaz-service-x86_64-unknown-linux-musl.tar.gz
            skyatlaz-service-aarch64-unknown-linux-musl.tar.gz
            SHA256SUMS
          body: |
            Static Linux builds of `skyatlaz-service`, with checksums.

            ```bash
            sha256sum --check SHA256SUMS
            tar -xzf skyatlaz-service-x86_64-unknown-linux-musl.tar.gz
            ```

            The environment variables, the systemd unit and the Caddyfile are in
            [`deploy/README.md`](https://github.com/bgrados31/skyatlaz-service/blob/main/deploy/README.md).
            New here? Read the [changelog](https://github.com/bgrados31/skyatlaz-service/blob/main/CHANGELOG.md) first.
